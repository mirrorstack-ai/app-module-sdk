name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # Runner selection is data, not code.
    # Unset RUNNER_LABELS falls back to GitHub-hosted arm64; the org variable currently
    # points at the shared self-hosted labels. arm64 is deliberate.
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-24.04-arm"]') }}
    # Limit hung jobs to 20 minutes so they cannot occupy one of three shared runners for six hours.
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      elasticmq:
        image: softwaremill/elasticmq-native
        ports:
          - 9324:9324
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go test -race -tags integration ./...
        env:
          DATABASE_URL: postgres://test:test@localhost:5433/test?sslmode=disable
          REDIS_URL: redis://localhost:6379
