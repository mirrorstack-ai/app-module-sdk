name: CI

on:
  push:
    branches: [main]
  # 🔴 NO BASE-BRANCH FILTER ON pull_request, DELIBERATELY.
  #
  # It was `branches: [main]`, which means a PR targeting anything else gets NO
  # workflow runs at all — not a failure, not a skip: an EMPTY check list, which
  # reads as "nothing to worry about". A stack is exactly where verification
  # matters most: each link is reviewed on top of code that has not landed yet.
  #
  # Measured in the sibling repos before this landed here: ms-app-modules had
  # three stacked PRs at pass=0, api-platform two. Same convention, copied.
  #
  # `push` keeps its filter — a push run exists to protect main, and running the
  # suite on every branch push would duplicate the PR run.
  pull_request:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 26  # p95 12.8m over 20 runs (gh-hosted); 2x p95
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      elasticmq:
        image: softwaremill/elasticmq-native
        ports:
          - 9324:9324
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go test -race -tags integration ./...
        env:
          DATABASE_URL: postgres://test:test@localhost:5433/test?sslmode=disable
          REDIS_URL: redis://localhost:6379

      # examples/template is its OWN Go module, so `./...` above never reached
      # it and nothing had compiled it since it was written — it silently
      # shipped a Config that omits Slug. It carries `replace => ../..`, which
      # is what makes this worth running: it builds against THIS working tree,
      # so an SDK change that breaks the documented example fails here instead
      # of in the first reader's terminal.
      - name: Build examples/template against this tree
        working-directory: examples/template
        run: |
          go vet ./...
          go build ./...
